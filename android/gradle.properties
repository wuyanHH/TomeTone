org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# NOTE: keep this file ASCII-only -- Gradle reads .properties as ISO-8859-1,
# so non-ASCII comments get mangled.
# Kotlin incremental caches intermittently fail to close on Windows (file-lock /
# AV interference), aborting :audio_session:compileDebugKotlin. Disabling
# incremental compilation makes builds reproducible at a modest recompile cost.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
